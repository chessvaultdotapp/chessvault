target-version = "py314"
line-length = 88

[lint]
select = [
    "E4",  # Import errors
    "E7",  # Statement errors
    "E9",  # Runtime errors
    "F",  # Pyflakes
    "I",  # Import sorting
    "UP",  # Modern Python syntax
    "B",  # Common bugs (flake8-bugbear)
    "SIM",  # Simplifications
    "C4",  # Comprehension improvements
    "PIE",  # Miscellaneous correctness and style checks
    "RUF",  # Ruff-specific checks
]
