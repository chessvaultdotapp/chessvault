[package]
name = "chessvault"
version = "0.0.0+26w42a"
edition = "2024"

[dependencies]
anyhow.workspace = true
chess-core = { path = "../../crates/chess-core" }
chrono = "0.4.45"
iced = { version = "0.14.0", features = ["svg", "tokio"] }
platform-dirs = { path = "../../crates/platform-dirs" }
serde.workspace = true
serde_json.workspace = true
tracing = "0.1.44"
tracing-appender = { version = "0.2.5" }
tracing-log = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
zerocopy.workspace = true

[dev-dependencies]
log = "0.4.34"
rstest.workspace = true

[build-dependencies]
anyhow.workspace = true
resvg = { version = "0.45.1", default-features = false }
