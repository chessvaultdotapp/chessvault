name: Prepare documentation diagrams
description: Restore exact generated SVGs or install tooling and regenerate them

runs:
  using: composite
  steps:
    # Include the actual browser version in the key: runner image updates can change rendering.
    - name: Select runner Chrome for Mermaid
      id: chrome
      shell: bash
      run: |
        chrome="$(readlink -f "$(command -v google-chrome)")"
        version="$("$chrome" --version)"
        echo "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "PUPPETEER_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"

    - name: Cache generated diagrams
      id: diagrams
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          crates/platform-dirs/docs/architecture.svg
          crates/platform-dirs/docs/resolution.svg
        # No restore prefixes: changed inputs must regenerate rather than reuse stale SVGs.
        key: diagrams-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.chrome.outputs.version }}-${{ hashFiles('crates/platform-dirs/docs/*.mmd', 'crates/platform-dirs/justfile', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/actions/prepare-diagrams/**', '.github/actions/setup-just/**') }}

    # Documentation also needs just for its Python environment setup, even on a cache hit.
    - name: Install just
      uses: ./.github/actions/setup-just

    - name: Install Node.js
      if: steps.diagrams.outputs.cache-hit != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24.22.1'

    - name: Install pnpm
      if: steps.diagrams.outputs.cache-hit != 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: '12.5.1'

    - name: Install diagram and SVG tooling
      if: steps.diagrams.outputs.cache-hit != 'true'
      shell: bash
      env:
        # Use the sandbox-enabled runner browser instead of downloading another copy.
        PUPPETEER_SKIP_DOWNLOAD: 'true'
      run: pnpm --filter . install --frozen-lockfile

    - name: Generate and optimize diagrams
      if: steps.diagrams.outputs.cache-hit != 'true'
      shell: bash
      run: just --justfile crates/platform-dirs/justfile diagram

    - name: Verify generated diagrams
      shell: bash
      run: |
        test -s crates/platform-dirs/docs/architecture.svg
        test -s crates/platform-dirs/docs/resolution.svg
