name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &rust-paths
      - '**/*.rs'
      - 'apps/chessvault/assets/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-uv/**'
      - 'tools/platform-dirs-differential/**'
      - 'venvs/platform-dirs-differential.requirements.txt'
      - 'venvs/justfile'
      - 'justfile'
  pull_request:
    paths: *rust-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-differential:
    name: Compare native platform directories (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Install just
        uses: ./.github/actions/setup-just

      - name: Install Python reference environment
        env:
          UV_PYTHON: '3.14.5'
        run: |
          uv python install "$UV_PYTHON"
          just --justfile venvs/justfile platform-dirs-differential

      - name: Compare native paths
        run: just check-platform-differential

  check:
    name: Build and check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      # Incremental state is large and provides little reuse on ephemeral runners.
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Cargo downloads and build artifacts
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/**/incremental
          # Version the policy to avoid restoring old, incremental-enabled artifacts.
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', '.cargo/**') }}-${{ github.sha }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', '.cargo/**') }}-
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      # Keep the build first: quality checks only matter if the code builds.
      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Install nextest
        uses: ./.github/actions/setup-nextest

      - name: Test
        run: cargo nextest run --workspace --locked

      - name: Test documentation
        run: cargo test --workspace --doc --locked

      # Default debug builds use development paths, not native OS directories.
      - name: Build native platform directories
        run: cargo build -p platform-dirs --all-targets --locked --no-default-features

      - name: Test native platform directories
        run: cargo nextest run -p platform-dirs --locked --no-default-features

      - name: Test native platform directory documentation
        run: cargo test -p platform-dirs --doc --locked --no-default-features

      - name: Install formatting and linting components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked --no-deps

      - name: Lint native platform directories
        run: cargo clippy -p platform-dirs --all-targets --locked --no-deps --no-default-features

      - name: Report Cargo cache footprint
        shell: bash
        run: |
          {
            echo '### Cargo cache footprint (uncompressed)'
            echo
            echo 'Compare restore/save step timings and compressed sizes in the cache action logs.'
            echo
            echo '```text'
            for path in "$HOME/.cargo/registry/index" "$HOME/.cargo/registry/cache" \
              "$HOME/.cargo/git/db" target target/debug/deps target/debug/build target/debug/incremental; do
              if [[ -d "$path" ]]; then
                du -sh "$path"
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # PRs reuse the main cache without uploading another copy of target.
      - name: Save Cargo downloads and build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/**/incremental
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
