name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo downloads and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      # Keep the build first: quality checks only matter if the code builds.
      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Install nextest
        uses: ./.github/actions/setup-nextest

      - name: Test
        run: cargo nextest run --workspace --locked

      - name: Test documentation
        run: cargo test --workspace --doc --locked

      - name: Install formatting and linting components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked --no-deps
