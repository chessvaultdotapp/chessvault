name: Markdown

on:
  push:
    paths:
      - '**/*.md'
  pull_request:
    paths:
      - '**/*.md'

permissions:
  contents: read

jobs:
  check:
    name: Check Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install rumdl
        uses: ./.github/actions/setup-rumdl

      - name: Check tracked Markdown files
        run: git ls-files -z '*.md' | xargs -0 -r rumdl check
