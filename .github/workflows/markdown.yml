name: Markdown

on:
  push:
    paths:
      - '**/*.md'
      - 'crates/platform-dirs/docs/*.mmd'
      - 'crates/platform-dirs/justfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/markdown.yml'
      - '.github/actions/setup-just/**'
      - '.github/actions/setup-rumdl/**'
  pull_request:
    paths:
      - '**/*.md'
      - 'crates/platform-dirs/docs/*.mmd'
      - 'crates/platform-dirs/justfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/markdown.yml'
      - '.github/actions/setup-just/**'
      - '.github/actions/setup-rumdl/**'

permissions:
  contents: read

jobs:
  check:
    name: Check Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.5.1'

      # Use runner Chrome to avoid AppArmor restrictions on downloaded Chrome.
      - name: Select runner Chrome for Mermaid
        run: |
          chrome="$(readlink -f "$(command -v google-chrome)")"
          "$chrome" --version
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"

      - name: Install diagram and SVG tooling
        run: pnpm install --frozen-lockfile

      - name: Install just
        uses: ./.github/actions/setup-just

      # MD057 checks image links, including ignored, generated SVGs.
      - name: Generate and optimize diagrams
        run: just --justfile crates/platform-dirs/justfile diagram

      - name: Install rumdl
        uses: ./.github/actions/setup-rumdl

      - name: Check tracked Markdown files
        run: git ls-files -z '*.md' | xargs -0 -r rumdl check
