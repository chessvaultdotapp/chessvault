name: Markdown

on:
  push:
    branches: [main]
    paths: &markdown-paths
      - '**/*.md'
      - 'crates/platform-dirs/docs/*.mmd'
      - 'crates/platform-dirs/justfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/markdown.yml'
      - '.github/actions/setup-just/**'
      - '.github/actions/prepare-diagrams/**'
  pull_request:
    paths: *markdown-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # MD057 checks image links, including ignored, generated SVGs.
      - name: Prepare documentation diagrams
        uses: ./.github/actions/prepare-diagrams

      - name: Install rumdl
        uses: chessvaultdotapp/actions-setup-rumdl@86f98314bd9485b425dc242c520a1df276f842e6 # rumdl 0.2.75
        with:
          version: '0.2.75'

      - name: Check tracked Markdown files
        run: git ls-files -z '*.md' | xargs -0 -r rumdl check
