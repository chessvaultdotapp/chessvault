name: Stable release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identify-tag:
    name: Identify stable tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stable: ${{ steps.tag.outputs.stable }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Identify stable tag
        id: tag
        shell: bash
        run: |
          # Only publish stable versions; exclude prereleases and build metadata.
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "$TAG" =~ $pattern ]]; then
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and package Linux artifacts
    needs: identify-tag
    if: needs.identify-tag.outputs.stable == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Build Linux binary
        shell: bash
        run: |
          cargo build -p chessvault --bin chessvault --release --locked \
            --target x86_64-unknown-linux-gnu --message-format=json > build-messages.jsonl
          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          messages = [json.loads(line) for line in pathlib.Path("build-messages.jsonl").read_text().splitlines()]
          outputs = [pathlib.Path(message["out_dir"]) for message in messages
                     if message["reason"] == "build-script-executed"
                     and pathlib.Path(message["out_dir"], "chessvault.png").is_file()]
          if len(outputs) != 1:
              raise SystemExit(f"Expected one generated ChessVault icon, found {len(outputs)}")
          shutil.copyfile(outputs[0] / "chessvault.png",
                          "target/x86_64-unknown-linux-gnu/release/chessvault.png")
          PY

      - name: Package Linux binary
        shell: bash
        run: |
          python3 tools/dist-prepare/linux.py target/x86_64-unknown-linux-gnu/release/chessvault --output dist/package
          tar -czf "dist/chessvault-${TAG}-linux-x86_64.tar.gz" \
            -C dist/package bin install-linux.sh share

      # Gate publication on tests of the exact archive we upload.
      - name: Test native installer package
        uses: ./.github/actions/test-installer-package
        with:
          package: ${{ github.workspace }}/dist/chessvault-${{ github.ref_name }}-linux-x86_64.tar.gz

      - name: Store native binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-native-linux-x86_64
          path: dist/chessvault-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils

      - name: Package and validate AppImage
        shell: bash
        run: |
          # Reuse the same binary and generated icon as the tested native archive.
          bash tools/build-appimage.sh --binary target/x86_64-unknown-linux-gnu/release/chessvault
          maximum=$(tail -n 1 dist/ChessVault-x86_64.glibc.txt)
          if [[ $(printf '%s\n' GLIBC_2.35 "$maximum" | sort -V | tail -n 1) != GLIBC_2.35 ]]; then
            echo "AppImage exceeds the glibc 2.35 baseline: $maximum" >&2
            exit 1
          fi
          cd dist
          mv ChessVault-x86_64.AppImage "chessvault-${TAG}-linux-x86_64.AppImage"

      - name: Store AppImage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-appimage-linux-x86_64
          path: dist/chessvault-*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-macos:
    name: Build and package macOS artifact
    needs: identify-tag
    if: needs.identify-tag.outputs.stable == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      # Provisional build baseline; runtime compatibility still needs testing.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      BUILD_NUMBER: ${{ github.run_number }}
      UV_PYTHON: '3.14.5'
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and target
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Install packaging Python
        run: uv python install "$UV_PYTHON"

      - name: Build macOS executable and icon
        run: |
          cargo build -p chessvault --bin chessvault --release --locked \
            --target aarch64-apple-darwin --message-format=json > build-messages.jsonl
          cargo metadata --format-version=1 --no-deps --locked > cargo-metadata.json

      - name: Validate, sign, and archive macOS app
        run: |
          uv run --no-project --python "$UV_PYTHON" python tools/dist-prepare/ci_macos.py \
            --messages build-messages.jsonl --metadata cargo-metadata.json \
            --build-number "$BUILD_NUMBER" --minimum-macos "$MACOSX_DEPLOYMENT_TARGET" \
            --tag "$TAG" --output "dist/chessvault-${TAG}-macos-aarch64.zip"

      - name: Store macOS app archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-native-macos-aarch64
          path: dist/chessvault-${{ github.ref_name }}-macos-aarch64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish stable release
    needs: [build, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out tagged release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stable-*
          merge-multiple: true
          path: dist

      - name: Verify release artifacts
        shell: bash
        run: |
          cd dist
          test -s "chessvault-${TAG}-linux-x86_64.tar.gz"
          test -s "chessvault-${TAG}-linux-x86_64.AppImage"
          test -s "chessvault-${TAG}-macos-aarch64.zip"

      - name: Create stable release
        shell: bash
        run: |
          # Rerunning a successful workflow must not replace an existing release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 0
          fi
          notes_file=$(mktemp)
          changelog="changelogs/$TAG.md"
          if [[ -f "$changelog" ]]; then
            cp "$changelog" "$notes_file"
          fi
          printf '\n\n### macOS download\n\n%s\n' \
            'Apple Silicon only; ad-hoc signed, not notarized. Gatekeeper may block launch. macOS 13.0 is a provisional deployment target, not a verified compatibility guarantee.' \
            >> "$notes_file"
          notes=(--notes-file "$notes_file")
          gh release create "$TAG" \
            "${notes[@]}" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --latest

      - name: Upload release artifacts
        shell: bash
        run: |
          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for asset in \
            "chessvault-${TAG}-linux-x86_64.tar.gz" \
            "chessvault-${TAG}-linux-x86_64.AppImage" \
            "chessvault-${TAG}-macos-aarch64.zip"; do
            if grep -Fxq "$asset" <<< "$existing"; then
              echo "Asset already exists: $asset"
            else
              gh release upload "$TAG" "dist/$asset"
            fi
          done

      - name: Remove development releases
        shell: bash
        run: |
          # Match tag-tool development tags; preserve stable and unrelated prereleases.
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\+([0-9A-Za-z-]+\.)*[0-9]{2}w[0-9]{2}[a-z]+$'
          releases=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")
          obsolete=$(jq -r --arg pattern "$pattern" '
            add
            | .[]
            | select(.prerelease and (.draft | not) and (.tag_name | test($pattern)))
            | .tag_name
          ' <<< "$releases")
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            # Deliberately omit --cleanup-tag to preserve the source reference.
            gh release delete "$tag" --yes
          done <<< "$obsolete"
