name: Development release

on:
  push:
    tags:
      - 'v*\+*'

permissions:
  contents: write

concurrency:
  group: development-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish development prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Identify development tag
        id: tag
        shell: bash
        run: |
          # Match the trailing week metadata produced by tag-tool --dev-rel.
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\+([0-9A-Za-z-]+\.)*[0-9]{2}w[0-9]{2}[a-z]+$'
          if [[ "$TAG" =~ $pattern ]]; then
            echo 'development=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out tagged commit
        if: steps.tag.outputs.development == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        if: steps.tag.outputs.development == 'true'
        run: rustup show active-toolchain

      - name: Build Linux binary
        if: steps.tag.outputs.development == 'true'
        run: cargo build -p chessvault --bin chessvault --release --locked --target x86_64-unknown-linux-gnu

      - name: Package Linux binary
        if: steps.tag.outputs.development == 'true'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/chessvault-${TAG}-linux-x86_64.tar.gz" \
            -C target/x86_64-unknown-linux-gnu/release chessvault

      - name: Create prerelease
        if: steps.tag.outputs.development == 'true'
        shell: bash
        run: |
          # Rerunning a successful workflow must not replace an existing release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 0
          fi
          notes=()
          changelog="changelogs/$TAG.md"
          if [[ -f "$changelog" ]]; then
            notes=(--notes-file "$changelog")
          fi
          gh release create "$TAG" \
            "${notes[@]}" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --prerelease \
            --latest=false

      - name: Upload Linux binary
        if: steps.tag.outputs.development == 'true'
        shell: bash
        run: |
          asset="chessvault-${TAG}-linux-x86_64.tar.gz"
          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if grep -Fxq "$asset" <<< "$existing"; then
            echo "Asset already exists: $asset"
          else
            gh release upload "$TAG" "dist/$asset"
          fi
