name: Python

on:
  push:
    paths:
      - '**/*.py'
      - '**/*.pyi'
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.pyi'

permissions:
  contents: read

jobs:
  check:
    name: Check Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Install just
        uses: ./.github/actions/setup-just

      - name: Install Python and development dependencies
        env:
          UV_PYTHON: '3.14.5'
        run: |
          uv python install "$UV_PYTHON"
          just --justfile venvs/justfile development tag-tool

      - name: Lint tracked Python files
        run: git ls-files -z '*.py' '*.pyi' | xargs -0 -r venvs/development/bin/ruff check

      - name: Check Python formatting
        run: git ls-files -z '*.py' '*.pyi' | xargs -0 -r venvs/development/bin/ruff format --check

      - name: Check Python types
        run: git ls-files -z '*.py' '*.pyi' | xargs -0 -r venvs/development/bin/ty check --python venvs/tag-tool

      - name: Test tag tool
        run: venvs/tag-tool/bin/python -m pytest tools/tag-tool -q
