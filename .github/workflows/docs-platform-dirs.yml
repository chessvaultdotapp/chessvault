name: Platform directories documentation

on:
  push:
    paths:
      - 'crates/platform-dirs/zensical.toml'
      - 'crates/platform-dirs/docs/**'
      - 'venvs/zensical.requirements.txt'
  pull_request:
    paths:
      - 'crates/platform-dirs/zensical.toml'
      - 'crates/platform-dirs/docs/**'
      - 'venvs/zensical.requirements.txt'

permissions:
  contents: read

jobs:
  build:
    name: Build platform-dirs documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.5.1'

      - name: Install Graphviz and SVG tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
          pnpm install --frozen-lockfile

      - name: Install just
        uses: ./.github/actions/setup-just

      - name: Generate and optimize diagrams
        run: just --justfile crates/platform-dirs/justfile diagram

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Install Python and Zensical
        run: |
          uv python install 3.14.5
          uv venv --python 3.14.5 venvs/zensical
          uv pip install --python venvs/zensical/bin/python --requirements venvs/zensical.requirements.txt

      # Cross-root documentation links are not yet staged into the site (issue #8).
      - name: Build documentation
        run: venvs/zensical/bin/zensical build --config-file crates/platform-dirs/zensical.toml
