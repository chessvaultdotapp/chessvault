name: Website release pin

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Development release, Stable release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing published release tag to pin
        required: true
        type: string

permissions:
  contents: read

# Do not cancel an update midway through its cross-repository writes.
concurrency:
  group: website-release-pin
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Open or update website PR
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_PIN_TOKEN }}
        run: python3 .github/scripts/update-website-pin.py
