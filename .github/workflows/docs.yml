name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'pnpm-workspace.yaml'
      - 'venvs/justfile'
      - 'zensical.toml'
      - 'docs/**'
      - 'crates/platform-dirs/zensical.toml'
      - 'crates/platform-dirs/docs/**'
      - 'crates/platform-dirs/justfile'
      - 'venvs/zensical.requirements.txt'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
      - '.github/actions/setup-uv/**'
      - '.github/actions/setup-just/**'
      - '.github/actions/prepare-diagrams/**'
  pull_request:
    paths:
      - 'pnpm-workspace.yaml'
      - 'venvs/justfile'
      - 'zensical.toml'
      - 'docs/**'
      - 'crates/platform-dirs/zensical.toml'
      - 'crates/platform-dirs/docs/**'
      - 'crates/platform-dirs/justfile'
      - 'venvs/zensical.requirements.txt'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
      - '.github/actions/setup-uv/**'
      - '.github/actions/setup-just/**'
      - '.github/actions/prepare-diagrams/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a main-branch run that may already be deploying Pages.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare documentation diagrams
        uses: ./.github/actions/prepare-diagrams

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Install Python and Zensical
        env:
          UV_PYTHON: '3.14.5'
        run: |
          uv python install "$UV_PYTHON"
          just --justfile venvs/justfile zensical

      # Cross-root documentation links are not yet staged into the site (issue #8).
      - name: Build documentation
        run: |
          venvs/zensical/bin/zensical build --config-file zensical.toml
          venvs/zensical/bin/zensical build --config-file crates/platform-dirs/zensical.toml

      - name: Assemble Pages site
        run: |
          mkdir -p _site/dev/docs/crates/platform-dirs
          cp -a site/. _site/dev/docs/
          cp -a crates/platform-dirs/site/. _site/dev/docs/crates/platform-dirs/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
